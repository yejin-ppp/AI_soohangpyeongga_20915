<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 고2 수학 모의고사 오답 개념진단 클리닉 (2022 개정 교육과정)</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- KaTeX for Math Rendering (동기 로드로 안정적인 수식 렌더링 보장) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

  <!-- Google Fonts: Pretendard / Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap"
    rel="stylesheet">

  <!-- 45개 전체 문항 2022 개정 교육과정 진단 데이터베이스 -->
  <script src="diagnosticData.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'Noto Sans KR', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 50%, #f1f5f9 100%);
      min-height: 100vh;
    }

    .math-font {
      font-family: 'KaTeX_Math', 'Times New Roman', serif;
    }

    @media print {
      body {
        background: #ffffff !important;
      }

      .no-print {
        display: none !important;
      }

      .print-only {
        display: block !important;
      }

      .report-card {
        box-shadow: none !important;
        border: 1px solid #cbd5e1 !important;
      }
    }

    .print-only {
      display: none;
    }
  </style>
</head>

<body class="text-slate-800 antialiased selection:bg-brand-500 selection:text-white">
  <div id="root"></div>

  <!-- React Code with Babel -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // =========================================================================
    // 안전한 KaTeX 수식 HTML 변환 함수 (DOM 간섭으로 인한 React 가상돔 충돌 방지)
    // =========================================================================
    function formatMathHtml(text) {
      if (!text) return "";
      if (typeof text !== "string") return String(text);

      if (window.katex && window.katex.renderToString) {
        try {
          // 1) 블록 수식 $$...$$ 변환
          let rendered = text.replace(/\$\$([\s\S]+?)\$\$/g, (_, math) => {
            try {
              return window.katex.renderToString(math.trim(), { displayMode: true, throwOnError: false });
            } catch (e) {
              return `$$${math}$$`;
            }
          });

          // 2) 인라인 수식 $...$ 변환
          rendered = rendered.replace(/\$([^\$\n]+?)\$/g, (_, math) => {
            try {
              return window.katex.renderToString(math.trim(), { displayMode: false, throwOnError: false });
            } catch (e) {
              return `$${math}$`;
            }
          });

          // 3) 줄바꿈 문자 <br/> 치환
          return rendered.replace(/\n/g, '<br/>');
        } catch (err) {
          console.warn("KaTeX format warning:", err);
        }
      }

      // KaTeX 미로딩 시 줄바꿈만 치환하여 반환
      return text.replace(/\n/g, '<br/>');
    }

    // React Fiber의 자식 노드 충돌을 원천 차단하는 전용 수식 뷰 컴포넌트
    function MathText({ text, className = "", as = "span" }) {
      const Component = as;
      const htmlContent = useMemo(() => formatMathHtml(text), [text]);
      return (
        <Component
          className={className}
          dangerouslySetInnerHTML={{ __html: htmlContent }}
        />
      );
    }

    // =========================================================================
    // 데이터베이스 바인딩
    // =========================================================================
    const DB = window.DIAGNOSTIC_DB || {};
    const EXAM_OPTIONS = window.ALL_EXAM_OPTIONS || [];

    // =========================================================================
    // 메인 App 컴포넌트
    // =========================================================================
    function App() {
      // 선택 상태: 기본값 9월 30번 (오답률 1위 킬러 문항)
      const [selectedMonth, setSelectedMonth] = useState("9");
      const [selectedQNum, setSelectedQNum] = useState(30);

      // 진단 진행 상태
      const [currentStepIndex, setCurrentStepIndex] = useState(0); // 0: Q1, 1: Q2, 2: Q3, 3: Q4
      const [diagnosisResult, setDiagnosisResult] = useState(null); // null | 'FAILED_STEP' | 'ALL_PASS'
      const [failedStepData, setFailedStepData] = useState(null);
      const [userAnswersHistory, setUserAnswersHistory] = useState([]); // [{ qNum, answer, questionText, step }]

      // 탭: 'diagnostic' (진단실) | 'top15' (Top 15 전체 맵) | 'curriculum' (2022 개정 성취기준표)
      const [activeTab, setActiveTab] = useState("diagnostic");

      // 현재 선택된 문항 데이터
      const currentItemKey = `${selectedMonth}-${selectedQNum}`;
      const currentItem = DB[currentItemKey];

      // 진단 상태 초기화 함수
      const resetDiagnosis = () => {
        setCurrentStepIndex(0);
        setDiagnosisResult(null);
        setFailedStepData(null);
        setUserAnswersHistory([]);
      };

      // 모의고사 회차 변경
      const handleMonthChange = (e) => {
        const newMonth = e.target.value;
        setSelectedMonth(newMonth);
        const group = EXAM_OPTIONS.find(m => m.month === newMonth);
        if (group && group.questions.length > 0) {
          setSelectedQNum(group.questions[0].qNum);
        }
        resetDiagnosis();
      };

      // 문항 번호 변경
      const handleQNumChange = (e) => {
        setSelectedQNum(Number(e.target.value));
        resetDiagnosis();
      };

      // 학생의 '예' 클릭: 다음 질문으로 즉시 전진 (마지막 질문이면 ALL_PASS)
      const handleAnswerYes = () => {
        if (!currentItem || !currentItem.steps) return;
        const currentStep = currentItem.steps[currentStepIndex];

        const newHistory = [
          ...userAnswersHistory,
          {
            stepIndex: currentStepIndex + 1,
            qNum: currentStep.qNum,
            answer: 'YES',
            questionText: currentStep.question,
            step: currentStep
          }
        ];
        setUserAnswersHistory(newHistory);

        // 다음 질문 단계가 남아있는가?
        if (currentStepIndex + 1 < currentItem.steps.length) {
          setCurrentStepIndex(prev => prev + 1);
        } else {
          // 모든 질문을 '예'로 통과한 경우
          setDiagnosisResult("ALL_PASS");
        }
      };

      // 학생의 '아니오' 클릭: 즉시 진단 종료 & 1:1 매핑 성취기준 결과 리포트 출력
      const handleAnswerNo = () => {
        if (!currentItem || !currentItem.steps) return;
        const currentStep = currentItem.steps[currentStepIndex];

        const newHistory = [
          ...userAnswersHistory,
          {
            stepIndex: currentStepIndex + 1,
            qNum: currentStep.qNum,
            answer: 'NO',
            questionText: currentStep.question,
            step: currentStep
          }
        ];
        setUserAnswersHistory(newHistory);
        setFailedStepData(currentStep);
        setDiagnosisResult("FAILED_STEP");
      };

      // 인쇄 / PDF 저장 기능
      const handlePrint = () => {
        window.print();
      };

      const currentExamInfo = EXAM_OPTIONS.find(m => m.month === selectedMonth);

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="bg-white/95 backdrop-blur-md border-b border-indigo-100 sticky top-0 z-50 shadow-xs no-print">
            <div className="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center space-x-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20 font-black text-xl">
                  ∑
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-[11px] font-bold px-2 py-0.5 rounded-full bg-brand-100 text-brand-700 tracking-wide uppercase">
                      2022 개정 수학과 교육과정
                    </span>
                    <span className="text-[11px] px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 font-semibold">
                      고2 모의고사 1:1 오답 클리닉
                    </span>
                  </div>
                  <h1 className="text-lg md:text-xl font-extrabold text-slate-900 tracking-tight">
                    수학 오답 개념진단 & 학습 처방 엔진
                  </h1>
                </div>
              </div>

              {/* Navigation Tabs */}
              <div className="flex items-center bg-slate-100 p-1 rounded-xl text-xs font-bold text-slate-600">
                <button
                  onClick={() => setActiveTab("diagnostic")}
                  className={`px-3.5 py-1.5 rounded-lg transition-all ${activeTab === "diagnostic"
                      ? "bg-white text-brand-700 shadow-xs font-extrabold"
                      : "hover:text-slate-900"
                    }`}
                >
                  🎯 맞춤 진단실
                </button>
                <button
                  onClick={() => setActiveTab("top15")}
                  className={`px-3.5 py-1.5 rounded-lg transition-all ${activeTab === "top15"
                      ? "bg-white text-brand-700 shadow-xs font-extrabold"
                      : "hover:text-slate-900"
                    }`}
                >
                  📊 Top 15 전체 맵 (45문항)
                </button>
                <button
                  onClick={() => setActiveTab("curriculum")}
                  className={`px-3.5 py-1.5 rounded-lg transition-all ${activeTab === "curriculum"
                      ? "bg-white text-brand-700 shadow-xs font-extrabold"
                      : "hover:text-slate-900"
                    }`}
                >
                  📚 2022 개정 성취기준표
                </button>
              </div>
            </div>
          </header>

          {/* Main Container */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-6 md:py-8">
            {/* TAB 1: 맞춤 진단실 */}
            {activeTab === "diagnostic" && (
              <div className="space-y-6">
                {/* 1. 문항 선택 컨트롤 패널 */}
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200/90 p-5 md:p-6 no-print">
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-slate-100">
                    <div>
                      <h2 className="text-base font-bold text-slate-900 flex items-center gap-2">
                        <span className="w-2.5 h-2.5 rounded-full bg-brand-500 animate-pulse"></span>
                        1단계: 진단할 모의고사 회차 및 오답 문항 선택
                      </h2>
                      <p className="text-xs md:text-sm text-slate-500 mt-0.5">
                        오답률 상위 15위(총 45문항) 중 진단할 문항을 고르면 해설지 논리 기반의 단계별 질문(Q1~Q4)이 제시됩니다.
                      </p>
                    </div>

                    {/* 회차 및 문항 셀렉터 */}
                    <div className="flex flex-wrap items-center gap-3">
                      <div>
                        <label className="block text-[11px] font-bold text-slate-500 mb-1">모의고사 회차</label>
                        <select
                          value={selectedMonth}
                          onChange={handleMonthChange}
                          className="bg-slate-50 border border-slate-300 text-slate-800 text-sm font-bold rounded-xl px-3 py-2 focus:ring-2 focus:ring-brand-500 focus:outline-none cursor-pointer"
                        >
                          <option value="9">2026학년도 9월 (대수·미적Ⅰ)</option>
                          <option value="3">2026학년도 3월 (공통수학1·2)</option>
                          <option value="6">2026학년도 6월 (대수 전범위)</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-[11px] font-bold text-slate-500 mb-1">오답률 순위 및 문항 번호</label>
                        <select
                          value={selectedQNum}
                          onChange={handleQNumChange}
                          className="bg-slate-50 border border-slate-300 text-slate-800 text-sm font-bold rounded-xl px-3 py-2 focus:ring-2 focus:ring-brand-500 focus:outline-none cursor-pointer max-w-[280px]"
                        >
                          {currentExamInfo?.questions.map((q, idx) => (
                            <option key={q.qNum} value={q.qNum}>
                              Top {idx + 1}위: {q.title} [오답률 {q.errorRate}]
                            </option>
                          ))}
                        </select>
                      </div>
                    </div>
                  </div>

                  {/* 선택된 문항 메타정보 배너 */}
                  {currentItem ? (
                    <div className="mt-4 flex flex-wrap items-center justify-between gap-3 text-xs md:text-sm">
                      <div className="flex flex-wrap items-center gap-2">
                        <span className="px-2.5 py-1 rounded-lg bg-indigo-50 border border-indigo-200 text-indigo-700 font-extrabold">
                          {currentItem.subject} &gt; {currentItem.curriculumDomain}
                        </span>
                        <span className="px-2.5 py-1 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 font-bold">
                          {currentItem.difficulty}
                        </span>
                        <span className="px-2.5 py-1 rounded-lg bg-amber-50 border border-amber-200 text-amber-700 font-semibold">
                          배점: {currentItem.score}점
                        </span>
                        <span className="text-slate-600 font-medium ml-1">
                          주제: <strong className="text-slate-800">{currentItem.topicTitle}</strong>
                        </span>
                      </div>
                      <div className="text-xs text-slate-500 font-medium">
                        총 <strong className="text-brand-600">{currentItem.steps.length}단계</strong> 진단 인터뷰 질문
                      </div>
                    </div>
                  ) : (
                    <div className="mt-4 p-4 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 text-sm">
                      선택하신 문항 데이터를 불러오는 중입니다.
                    </div>
                  )}
                </div>

                {/* 2. 인터랙티브 진단 영역 (질문 진행 중 or 최종 리포트 카드) */}
                {currentItem && (
                  <div className="bg-white rounded-2xl shadow-sm border border-slate-200/90 overflow-hidden report-card">
                    {/* 상단 프로그레스 바 */}
                    <div className="bg-slate-50/90 px-6 py-4 border-b border-slate-100 no-print">
                      <div className="flex items-center justify-between text-xs font-bold text-slate-500 mb-2">
                        <span className="flex items-center gap-1.5 text-brand-700">
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                          </svg>
                          해설지 풀이 알고리즘 기반 단계별 진단
                        </span>
                        <span>
                          {diagnosisResult === null ? (
                            `진행 중: ${currentStepIndex + 1}단계 / 총 ${currentItem.steps.length}단계`
                          ) : (
                            <strong className="text-brand-600">진단 완료</strong>
                          )}
                        </span>
                      </div>

                      {/* Progress Track */}
                      <div className="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                        <div
                          className={`h-full transition-all duration-300 rounded-full ${diagnosisResult === "FAILED_STEP"
                              ? "bg-rose-500"
                              : diagnosisResult === "ALL_PASS"
                                ? "bg-emerald-500"
                                : "bg-brand-600"
                            }`}
                          style={{
                            width:
                              diagnosisResult === "FAILED_STEP"
                                ? `${((currentStepIndex + 1) / currentItem.steps.length) * 100}%`
                                : diagnosisResult === "ALL_PASS"
                                  ? "100%"
                                  : `${((currentStepIndex) / currentItem.steps.length) * 100}%`
                          }}
                        ></div>
                      </div>

                      {/* Step Indicator Badges */}
                      <div className="flex items-center justify-between mt-3 text-xs">
                        {currentItem.steps.map((st, idx) => {
                          let badgeClass = "bg-slate-100 text-slate-400 border-slate-200";
                          let label = st.qNum;

                          if (idx < currentStepIndex) {
                            badgeClass = "bg-emerald-100 text-emerald-700 border-emerald-300 font-bold";
                            label += " 통과 ✓";
                          } else if (idx === currentStepIndex && diagnosisResult === null) {
                            badgeClass = "bg-brand-600 text-white border-brand-700 font-extrabold shadow-sm scale-105";
                            label += " 현재 질문";
                          } else if (idx === currentStepIndex && diagnosisResult === "FAILED_STEP") {
                            badgeClass = "bg-rose-500 text-white border-rose-600 font-extrabold shadow-sm";
                            label += " 결손 발견 ✕";
                          } else if (diagnosisResult === "ALL_PASS") {
                            badgeClass = "bg-emerald-100 text-emerald-700 border-emerald-300 font-bold";
                            label += " 통과 ✓";
                          }

                          return (
                            <span
                              key={st.qNum}
                              className={`px-3 py-1 rounded-full border text-[11px] transition-all ${badgeClass}`}
                            >
                              {label}
                            </span>
                          );
                        })}
                      </div>
                    </div>

                    {/* 진단 본문 카드 */}
                    <div className="p-6 md:p-8">
                      {/* ======================================================= */}
                      {/* 상태 1: 질문 진행 중 (diagnosisResult === null) */}
                      {/* ======================================================= */}
                      {diagnosisResult === null && currentItem.steps[currentStepIndex] && (
                        <div className="space-y-6">
                          {/* 문항 요약 안내 */}
                          <div className="bg-brand-50/70 border border-brand-100 rounded-xl p-4 flex items-start gap-3">
                            <span className="text-xl">💡</span>
                            <div className="text-xs md:text-sm text-slate-700 leading-relaxed">
                              <strong className="text-brand-900 font-bold">문항 핵심 상황:</strong>{" "}
                              <MathText text={currentItem.questionSummary} />
                            </div>
                          </div>

                          {/* 현재 질문 박스 */}
                          <div className="bg-slate-50 border-2 border-slate-200 rounded-2xl p-6 md:p-8 text-center space-y-4 shadow-xs transition-all">
                            <div className="inline-block px-3 py-1 rounded-md bg-brand-600 text-white text-xs font-black tracking-wider uppercase">
                              진단 질문 {currentItem.steps[currentStepIndex].qNum} (Step {currentStepIndex + 1})
                            </div>

                            <div className="text-lg md:text-2xl font-extrabold text-slate-900 leading-snug px-2 max-w-4xl mx-auto">
                              "<MathText text={currentItem.steps[currentStepIndex].question} />"
                            </div>

                            <p className="text-xs md:text-sm text-slate-500 font-medium">
                              풀이 과정 중 위 단계의 수학적 개념과 성질을 스스로 적용하고 해결할 수 있었나요?
                            </p>
                          </div>

                          {/* 예 / 아니오 선택 버튼 UI */}
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                            {/* 예 버튼 */}
                            <button
                              type="button"
                              onClick={handleAnswerYes}
                              className="group relative flex items-center justify-center gap-3 py-4 px-6 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-extrabold text-base md:text-lg shadow-lg shadow-emerald-500/25 hover:from-emerald-600 hover:to-teal-700 hover:shadow-xl hover:shadow-emerald-500/35 transition-all transform hover:-translate-y-0.5 active:translate-y-0 cursor-pointer"
                            >
                              <span className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center text-base font-black">
                                ✓
                              </span>
                              예 (이해했고 해결할 수 있습니다)
                            </button>

                            {/* 아니오 버튼 */}
                            <button
                              type="button"
                              onClick={handleAnswerNo}
                              className="group relative flex items-center justify-center gap-3 py-4 px-6 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-600 text-white font-extrabold text-base md:text-lg shadow-lg shadow-rose-500/25 hover:from-rose-600 hover:to-pink-700 hover:shadow-xl hover:shadow-rose-500/35 transition-all transform hover:-translate-y-0.5 active:translate-y-0 cursor-pointer"
                            >
                              <span className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center text-base font-black">
                                ✕
                              </span>
                              아니오 (여기서 막히거나 헷갈립니다)
                            </button>
                          </div>

                          <div className="text-center text-xs text-slate-400 font-medium">
